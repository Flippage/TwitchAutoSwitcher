name: Build AutoSwitcher

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.0.0). Leave blank to just build.'
        required: false
        default: ''

permissions:
  contents: write   # needed to create a Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ steps.ver.outputs.tag }}".TrimStart('v') }
          elseif ("${{ inputs.version }}" -ne "") { $v = "${{ inputs.version }}".TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
          $release = ("${{ github.ref_type }}" -eq "tag") -or ("${{ inputs.version }}" -ne "")
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish (small, needs .NET 10 Desktop Runtime)
        run: dotnet publish src/AutoSwitcher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.version }} -o dist

      - name: Publish (standalone)
        run: dotnet publish src/AutoSwitcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.version }} -o dist-standalone

      # Launch both builds for real and make sure they start, show the window and open every page.
      - name: Smoke test (starts and shows UI)
        shell: pwsh
        run: |
          foreach ($exe in @("dist/AutoSwitcher.exe", "dist-standalone/AutoSwitcher.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
            if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "$exe --selftest timed out" }
            if ($p.ExitCode -ne 0) {
              $log = Join-Path $env:APPDATA "AutoSwitcher/error.log"
              if (Test-Path $log) { Get-Content $log }
              throw "$exe --selftest failed with exit code $($p.ExitCode)"
            }
            Write-Host "$exe OK"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: AutoSwitcher
          path: dist/AutoSwitcher.exe

      - uses: actions/upload-artifact@v7
        with:
          name: AutoSwitcher-standalone
          path: dist-standalone/AutoSwitcher.exe

      # ---- Release (only for v* tags) ----
      - name: Package release files
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $v = "${{ steps.ver.outputs.tag }}"
          Copy-Item dist-standalone/AutoSwitcher.exe "release/AutoSwitcher-$v.exe"
          Copy-Item dist/AutoSwitcher.exe "release/AutoSwitcher-$v-small-needs-dotnet10.exe"
          Compress-Archive -Path dist-standalone/AutoSwitcher.exe -DestinationPath "release/AutoSwitcher-$v.zip"

      - name: Create GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: AutoSwitcher ${{ steps.ver.outputs.tag }}
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body: |
            **Download `AutoSwitcher-${{ steps.ver.outputs.tag }}.exe`** (or the `.zip` if your browser or chat app blocks .exe files). It runs on any Windows 10/11 64-bit PC with nothing else to install.

            The `-small-needs-dotnet10` version is tiny, but needs the free [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0).

            **First launch:** the app isn't code-signed, so Windows SmartScreen may say "Windows protected your PC". Click **More info → Run anyway**.

            **Setup:** open AutoSwitcher → Account → **Connect with Twitch**, approve the code, then add your games on Mappings.
